description: |-
  Louver doors are a great solution for small spaces. The louvers, or slats, on the doors allow for easy air ventilation, making them a popular choice for laundry rooms, utility closets and more. For more traditional uses, louvered doors are beautiful additions to any relaxed, contemporary home.

  This beautiful bifold closet door features a 2-panel louver design on 1 1/8" thick bifold panels. The 1 1/8" thick panels are sturdier and more durable than standard Big Box 1" thick bifold panels. Both the bottom and top panels are louvered. The door comes in a variety of heights and widths to suit its primary use in a closet setting paired with another identical door or one independent. The clear pine material is perfect for a stain finish.

  Our pine bifold doors are made with solid stiles(sides) and rails, allowing some room for trimming; however, the tolerance is minimal as too much trimming may affect the integrity of the door. Please contact customer service to confirm cuts or receive a quote for special dimensions.

  Single unit bifolds with widths of 48”, 60”, and 72” are on the same track. Actual width of bifold doors are slightly less than indicated to allow for proper installation – i.e. 24” wide by 80” high actually measures 11-13/16” wide per panel by 79” high. 24” wide by 96” high actually measures 11-13/16” wide per panel by 95” high.

  To determine the size of bifold needed, you will want to measure your Finished Opening (please measure from side to side, then top to bottom after Sheetrock has been installed). For example, if you have an exact dimension of 60”W x 80”H, then you can order our standard (2) 30”W x 80”H size bifold units.

  Bifolds include overhead track and hardware for each unit.
