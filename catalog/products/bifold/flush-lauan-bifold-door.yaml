description: |-
  * Limited quantities available

  The natural flush lauan surface of our flush lauan bifold door is a sleek and contemporary look for any modern home or style. Our Flush Lauan Bifold Door fit perfectly in those tight spaces without sacrificing design and quality.

  This door is hollow core and features a flush lauan surface 1 3/8" thick. Doors will come unfinished and need to be properly prepared before painting or staining. The flush lauan bifold door comes in a variety of heights and widths for closets, pantries, and other areas in your home. Finish with a clear top coat to showcase the wood's natural beauty, or paint to match its surroundings.

  Due to their construction, these items cannot be trimmed down and are sold as is. If you require special dimensions, please contact customer service for a custom quote.

  Single unit bifolds with widths of 48”, 60”, and 72” are on the same track. Actual width of bifold doors are slightly less than indicated to allow for proper installation – i.e. 24” wide by 80” high actually measures 11-13/16” wide per panel by 79” high. 24” wide by 96” high actually measures 11-13/16” wide per panel by 95” high.

  To determine the correct size for your flush lauan bifold closet door, you will want to measure your Finished Opening (please measure from side to side, then top to bottom after Sheetrock has been installed). For example, if you have an exact dimension of 60”W x 80”H, then you can order our standard (2) 30”W x 80”H size bifold units.

  Bifolds include overhead track and hardware for each unit.
