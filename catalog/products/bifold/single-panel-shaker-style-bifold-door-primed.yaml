description: |-
  This Shaker bifold door is popular with homeowners because of its impeccable craftsmanship, careful attention to detail, and simplicity of design. The minimalism characteristic of this style is evident in our line of Shaker doors. These interior Shaker doors are ideal for anyone looking to add traditional or craftsman style to their home.

  The versatile design of our single-panel Shaker bifold door makes it a great choice for a variety of interior applications throughout your home. This door is ideal for bedroom closets, walk-in closets, utility closets, laundry rooms, kitchen pantries, hallway linen closets, and additional storage spaces.

  This bifold door features a single-panel design on 1-3/8" pine, perfect for a set of single panel closet doors. The panels are stacked in a traditional Shaker style. The primed surface still needs to be properly prepared with light sanding before adding paint. Bifold is sold with silver hinge finish only.

  Our pine wood bifold doors are made with solid stiles(sides) and rails, allowing some room for trimming; however, the tolerance is minimal as too much trimming may affect the integrity of the door. Please contact customer service to confirm cuts or receive a quote for special dimensions.

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of the Shaker style is made with solid MDF.

  Single unit bifolds with widths of 48”, 60”, and 72” are on the same track. Actual width of bifold doors are slightly less than indicated to allow for proper installation – i.e. 24” wide by 80” high actually measures 11-13/16” wide per panel by 79” high. 24” wide by 96” high actually measures 11-13/16” wide per panel by 95” high.

  To determine the correct size for your Shaker bifold door, you will want to measure your Finished Opening (please measure from side to side, then top to bottom after Sheetrock has been installed). For example, if you have an exact dimension of 60”W x 80”H, then you can order our standard (2) 30”W x 80”H size bifold units.

  Bifolds include overhead track and hardware for each unit.
