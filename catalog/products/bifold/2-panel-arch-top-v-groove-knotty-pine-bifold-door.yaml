description: |-
  Limited Quantities Available. Please Inquire for Large Orders.

  With its characteristic rich grain and knots, the knotty pine species is a beautiful addition to any rustic or country-style home. Our 2-panel arch top V-groove knotty pine bifold door offers a rustic, space-saving solution for a variety of interior applications.

  This versatile bifold closet door is ideal for bedroom closets, laundry rooms, kitchen pantries, hallway linen closets, and other storage areas. The folding design provides convenient access without requiring the clearance of a traditional swinging door.

  This Knotty Pine door come in several panel options that highlight the uniqueness of the wood. The bifold knotty pine door fits perfectly in those tight spaces without sacrificing design and quality.

  This Knotty Pine bifold door features a traditional 2-panel design with 1 3/8" thick bifold panels. The 1 3/8" thick panels are sturdier and more durable than standard Big Box 1" bifold panels. When closed, the door resembles our 2 Panel Arch Top Knotty Pine Door.

  The bottom panel is square while the top features a gentle arch for added interest. The door comes in a variety of heights and widths to suit most any space in your home. Finish with a clear top coat to showcase the wood's natural beauty.

  Our pine bifold doors are made with solid stiles(sides) and rails, allowing some room for trimming; however, the tolerance is minimal as too much trimming may affect the integrity of the door. Please contact customer service to confirm cuts or receive a quote for special dimensions.

  Single unit bifolds with widths of 48”, 60”, and 72” are on the same track. Actual width of bifold doors are slightly less than indicated to allow for proper installation – i.e. 24” wide by 80” high actually measures 11-13/16” wide per panel by 79” high. 24” wide by 96” high actually measures 11-13/16” wide per panel by 95” high.

  To determine the size of bifold needed, you will want to measure your Finished Opening (please measure from side to side, then top to bottom after Sheetrock has been installed). For example, if you have an exact dimension of 60”W x 80”H, then you can order our standard (2) 30”W x 80”H size bifold units.

  Bifolds include overhead track and hardware for each unit.
