description: |-
  Molded bifold doors are perfectly suited to classic American architecture. They are easy to maintain and come in a variety of styles. The bi-fold door style helps to maximize valuable space and is perfect for places where a swinging door is not suitable.

  The Colonist Molded Bifold Door has a textured surface and primed finish ready for paint. The six raised panels give it a contemporary design that is suitable for any modern home.

  Single unit bifolds with widths of 48”, 60”, and 72” are on the same track. Actual width of molded bifold doors are slightly less than indicated to allow for proper installation – i.e. 24” wide by 80” high actually measures 11-13/16” wide per panel by 79” high. 24” wide by 96” high actually measures 11-13/16” wide per panel by 95” high.

  To determine the size of bifold needed, you will want to measure your Finished Opening (please measure from side to side, then top to bottom after Sheetrock has been installed). For example, if you have an exact dimension of 60”W x 80”H, then you can order our standard (2) 30”W x 80”H size bifold units.

  Bifolds include overhead track and hardware for each unit.
