title: Prehung 2 Panel Square Top Pine Interior Door
status: active
category: prehung
description: |-
  Nothing is more traditional than a paneled door. If you're looking to add a little design interest to your door style, why not try a square design. Squared raised panels add intrigue to any door while maintaining the traditional look and feel.

  This door features a 2-panel design on 1 3/8" thick pine. The bottom panel is square while the top features a gentle squared look to match. The door comes in a variety of heights and widths to suit most any space in your home. The clear pine material is perfect for either a rich stain or paint finish.
