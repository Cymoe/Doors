status: active
category: prehung
description: |-
  With its characteristic rich grain and knots, the knotty pine species is a beautiful addition to any rustic or country-style home. Our Knotty Pine doors come in several panel options that highlight the uniqueness of the wood.

  This door features a 2-panel design on 1 3/8" thick knotty pine. The bottom panel is square while the top features a gentle arch for added interest. The door comes in a variety of heights and widths to suit most any space in your home. Finish with a clear top coat to showcase the wood's natural beauty.
