title: Prehung Raised Double Hip 4 Panel Pine Interior Door
status: active
category: prehung
description: |-
  The traditional raised panel design has been a staple of home design for hundreds of years. The frame and panel construction was initially developed to combat moisture damage, but the style quickly became a favorite for those looking to add a grand statement to their home.

  This door features a 4-panel double hip design on 1 3/8" thick pine. The double hip on the panel adds just a touch more detail to the overall design. The door comes in a variety of heights and widths to suit most any space in your home. The clear pine material is perfect for either a rich stain or paint finish.

  * Widths 20" and under include only two panels but follow the four panel design and layout
