title: Prehung Single Lite Clear Shaker Style Interior Door (Primed)
status: active
category: prehung
description: |-
  French doors are a beautiful and stylish option for an interior door. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look. Our French doors come in a variety of grid options, from single lite all the way up to 18-lite.

  This French door features a single-lite design on 1 3/8" thick pine. The single-lite door with clear glass offers a more contemporary alternative to the traditional French door design. The variety of sizes available make it perfectly suited for either a single or double door opening. The primed solid core engineered hardwood door with a thin top layer of MDF can be finished with any water based product after properly preparing (see painting instructions below in the Handing and Finishing Instructions link) your primed door.

  *All glass in our French Door line is tempered. Doors are shipped with a layer of plastic covering the glass. We recommend removing after you've completed finishing with an water-based product only with a straight edge razor.
