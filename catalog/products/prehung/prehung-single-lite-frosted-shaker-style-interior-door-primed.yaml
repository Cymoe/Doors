title: Prehung Single Lite Frosted Shaker Style Interior Door (Primed)
status: active
category: prehung
description: |-
  Shaker doors are a beautiful and stylish option for an interior door. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look.

  This Shaker door features a single-lite design on 1 3/8" thick pine. The single-lite door with frosted glass offers a more contemporary alternative to the traditional door design. The primed clear pine material can be finished with a light sanding using a fine-grit sandpaper and the water-based color of your choice.

  *All glass is tempered. Doors are shipped with a layer of plastic covering the glass. We recommend removing after you've completed finishing with a water-based product only with a straight edge razor.
