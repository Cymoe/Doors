title: Custom Fit Pocket Door Frame
status: active
category: hardware
description: |-
  Processing lead time can be approximately 2-3 weeks.

  Our set up pocket door frame that we make in house, all the wood that is used in the pocket door frame is pine. To give it the strength and to make it more rigid, there are 2 galvanized steel extrusions that are applied in the frame construction. On the bottom of the pocket door frame, there is a metal plate that is applied when assembled that the customer will use to nail down the pocket frame to their finished floor. There is also one rubber bumper so when the door is shut in the opening, to give it a soft, quiet sound.

  The track that runs the door is made of galvanized steel on a standard pocket door frame. On a heavy-duty pocket door frame, it is aluminum. In a standard pocket door frame of hardware (150 lb), it contains 2 non-ball-bearing rollers and 2 plates that attach to the top of the doors and a set of aligners that are put on the lower edge to guide the door in and out of the opening. On a heavy-duty bag (225 lb), everything is the same except that the rollers are ball-bearing.

  Select your jamb size, closure options, and track capacity.

  View Installation Steps Here
