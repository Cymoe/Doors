description: |-
  Lifetime mechanical warranty | Five years finish warranty

  General Specifications (for full product specs download the forms below)

  • ANSI A156.2 Grade 3

  • Door Prep.: 2-⅛” Cross Bore; 5-½” C-T-C; 1” Edge

  • 5-pin KW keyway; solid brass cylinder

  • Latch: 1” face, ¼” radius corner, adjustable

  • Saturn knob interior trim; Baron for Venetian Bronze and Matte Black finish

  Strike:

  • Deadbolt: 2-¼” x 1-¾” full-lip, ¼” radius corner

  • Handle: 2-¼” x 1-¾” full-lip, ¼” radius corner

  Single Cylinder:
  Deadbolt operated by key outside and turn-piece
  inside. Latchbolt operated by thumb-piece outside and knob or lever inside.
  Double Cylinder:
  Deadbolt operated by key on both sides. Latchbolt operated by thumb-piece outside and knob or lever inside.
  Dummy:
  Handle and knob or lever act as pull only. No
  operation.

  All locks include an adjustable latch for 2-3/8" and 2-3/4" backsets.

  Download Specification Sheet | Download Installation Sheet
