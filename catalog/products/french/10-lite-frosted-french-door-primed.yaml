  This French door features a 10-lite design on 1 3/8" thick pine. The 10-lite door works perfectly for either a single or double door opening. The frosted glass provides privacy while still allowing light to flow through the panes. The primed clear pine material can be finished with a light sanding using a fine-grit sandpaper and the water-based color of your choice.

  *All glass in our French Door line is tempered. Doors are shipped with a layer of plastic covering the glass. We recommend removing after you've completed finishing with an oil-based product only with a straight edge razor.
