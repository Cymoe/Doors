description: |-
  French doors are a beautiful and stylish option for an interior door. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look. Our French doors come in a variety of grid options, from single lite all the way up to 18-lite.

  This French door features a 5-lite design on 1 3/8" thick pine. The 5-lite door works perfectly for a small single or double door opening. Smaller widths can even be used as a sidelight for larger door openings. This beautiful interior door features a primed clear pine material that can be finished with a light sanding using a fine-grit sandpaper along with the water-based color of your choice.

  Available in narrow widths of 15", 16", and 18" with a standard 80" height, this 5 Lite French door is ideal for smaller interior openings, double-door applications, or sidelite-style installations.

  *16"W x 80"H doors cannot have a Bore in sides for regular doorknob. This size width can only host a dummy knob.

  *All glass in our French Door line is tempered. Over spray may occur in the priming process. It is normal for the windows to look painted. There is a plastic layer on top of the glass that can be removed with a straight edge razor. We recommend waiting to remove after you've finished painting your door.
