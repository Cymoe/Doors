title: Single Lite Glass Panel Solid Core Pine Wood French Interior Door
status: active
category: french
description: |-
  French doors are a beautiful and stylish option for an interior door. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look. Our French doors come in a variety of grid options, from single lite all the way up to 18-lite.

  This French interior glass door features a single-lite design on 1 3/8" thick pine. The single-lite doors offer a more contemporary alternative to the traditional French door design. The variety of sizes available make it perfectly suited for either a single or double door opening. The clear pine material can be finished using a rich stain or a clear top coat for a natural look.

  *16"W x 80"H doors cannot have a Bore in sides for regular doorknob. This size width can only host a dummy knob.

  *All glass in our French Door line is tempered. Doors are shipped with a layer of plastic covering the glass. We recommend removing after you've completed finishing with an oil-based product only with a straight edge razor.
