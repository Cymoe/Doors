description: |-
  Shaker style doors are a beautiful and stylish option for an interior door. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look.

  This Shaker door features a single-lite design on 1 3/8" thick pine. The single-lite door with frosted glass offers a more contemporary alternative to the traditional Shaker door design. The variety of sizes available make it perfectly suited for either a single or double door opening. This beautiful Shaker-style door features a clear pine material that can be finished using a rich stain or a clear top coat for a natural look.

  *All glass is tempered. Doors are shipped with a layer of plastic covering the glass. We recommend removing after you've completed finishing with a water-based product only with a straight edge razor.
