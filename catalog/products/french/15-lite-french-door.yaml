description: |-
  French doors are a beautiful and stylish option for an interior door. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look. Our French doors come in a variety of grid options, from single lite all the way up to 18-lite.

  Sizing options include 28", 30", 32", 34", and 36" widths, all available in an 80" height. This 15 lite glass French clear pine wood interior door gives you multiple standard width options for interior openings while keeping a consistent 80" door height.

  This French door features a 15-lite design on 1 3/8" thick pine. The 15-lite door works perfectly for either a single or double door opening if you're looking for a grander look. The clear pine material can be finished using a rich stain or a clear top coat for a natural look.

  *All glass in our French Door line is tempered. Doors are shipped with a layer of plastic covering the glass. We recommend removing after you've completed finishing with an oil-based product only with a straight edge razor.
