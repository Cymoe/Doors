# Custom solid pine interior door, built to the customer's opening.
# Variants = configuration x wood x style.
# price = basePrice + leaves x (wood adder + style adder [+ oversize adder])
#   leaves = number of door slabs, so a double door pays style/wood extras twice.
# Single ($495) and Double ($995) come from the listing; the rest are
# estimated from them (see comments). Set status: draft to hide it from the site.
type: door
handle: solid-pine-interior-door
title: Custom Solid Pine Interior Door
cardNote: Built to your exact opening
status: active
skuPrefix: PINE
description: |
  Custom solid pine interior doors, made in Texas. They're
  clear pine with tight, straight grain, sold raw and unfinished so you can stain
  or paint them to match your home. Solid wood is heavier and quieter than the
  hollow-core doors at the big box stores.

  Every door is built to your exact opening. Choose a single, a double door, a
  bifold, a barn door, or a pocket door, in clear or knotty pine.
highlights:
  - Solid pine, not hollow core
  - Built to your exact opening size
  - Sold unfinished, ready to stain or paint
  - Made in Texas
tags: [interior door, solid wood, pine, custom, unfinished]
images:
  - { src: /images/doors/style-shaker.jpg, alt: Single panel shaker style solid pine door }
specs:
  species: Pine
  construction: Solid wood
  finish: Unfinished
  made_in: Texas
seo:
  title: Custom Solid Pine Interior Doors | Made in Texas
  description: Solid pine interior doors built to your exact opening. Singles from $495, double doors from $995. Sold unfinished, ready to stain or paint.

configurations:
  - { name: Single,      code: SGL,    image: /images/doors/type-single.jpg, leaves: 1, basePrice: 495 }  # from listing
  - { name: Double Door, code: DBL,    image: /images/doors/type-double.jpg, leaves: 2, basePrice: 995 }  # "French pair" price from the listing
  - { name: Bifold,      code: BIF,    image: /images/doors/type-bifold.jpg, leaves: 2, basePrice: 795 }  # 2 narrow slabs + hinging; between single and pair
  - { name: Barn Door,   code: BARN,   image: /images/doors/type-barn.jpg, leaves: 1, basePrice: 595 }  # oversized slab to overlap the opening; hardware not included
  - { name: Pocket Door, code: POCKET, image: /images/doors/type-pocket.jpg, leaves: 1, basePrice: 545 }  # single slab, extra fitting for the pocket frame; frame not included

# Adders are per slab.
grades:
  - { name: Clear Pine,  code: CLR, image: /images/doors/wood-clear.jpg, adder: 0 }
  - { name: Knotty Pine, code: KNT, image: /images/doors/wood-knotty.jpg, adder: 0 }    # same price as clear, so "singles from $495" holds

styles:
  - { name: 2-Panel Square Top, code: 2PSQ, image: /images/doors/style-2-panel-square-top.jpg, adder: 0 }    # the base door
  - { name: Shaker,             code: SHK,  image: /images/doors/style-shaker.jpg, adder: 0 }    # same build as square top, flat panels
  - { name: 4-Panel,            code: 4P,   image: /images/doors/style-4-panel.jpg, adder: 50 }   # extra rails and panels
  - { name: 2-Panel Arch Top,   code: 2PAR, image: /images/doors/style-2-panel-arch-top.jpg, adder: 125 }  # curved top rail and panel

# Combinations you don't build. Any field left out matches everything.
exclude: []
  # - { configuration: POCKET, style: 4P }

# Sizes are OPENING sizes in inches (inside the frame), per door. A double
# door or bifold splits the opening width between its 2 doors (a 60" double
# opening = two 30" doors). A standard 36" x 80" door fits an opening of about
# 36 1/2" x 80 1/2", so the standard limits leave a little room.
sizing:
  min:      { width: 10, height: 60 }               # smaller -> request a quote
  standard: { width: 37, height: 81 }               # up to this: listed price
  oversize: { width: 43, height: 97, adderPerLeaf: 100 }  # up to this: +$100 per door; larger -> quote

# leadTimeWeeks: { min: 2, max: 4 }   # TODO: shown on the product page
