# Custom solid pine interior door, built to the customer's opening.
# Variants = configuration x wood x style.
# price = basePrice + leaves x (wood adder + style adder)
#   leaves = number of door slabs, so a French pair pays style/wood extras twice.
# Single ($495) and French Pair ($995) come from the listing; the rest are
# estimated from them (see comments).
type: door
handle: solid-pine-interior-door
title: Solid Pine Interior Door, Custom Built
status: draft
skuPrefix: PINE
description: |
  Custom solid pine interior doors, handbuilt locally in Midland/Odessa. They're
  clear pine with tight, straight grain, sold raw and unfinished so you can stain
  or paint them to match your home. Solid wood is heavier and quieter than the
  hollow-core doors at the big box stores.

  Every door is built to your exact opening. Choose a single, a French pair, a
  bifold, a barn door, or a pocket door, in clear or knotty pine.
highlights:
  - Solid pine, not hollow core
  - Built to your exact opening size
  - Sold unfinished, ready to stain or paint
  - Handbuilt in Midland/Odessa, Texas
tags: [interior door, solid wood, pine, custom, unfinished]
images: []   # add {src, alt} entries; image URLs must be publicly reachable
specs:
  species: Pine
  construction: Solid wood
  finish: Unfinished
  built_in: Midland/Odessa, TX
seo:
  title: Custom Solid Pine Interior Doors | Built in Midland, TX
  description: Solid pine interior doors built to your exact opening. Singles from $495, French pairs from $995. Sold unfinished, ready to stain or paint.

configurations:
  - { name: Single,      code: SGL,    leaves: 1, basePrice: 495 }  # from listing
  - { name: French Pair, code: FRP,    leaves: 2, basePrice: 995 }  # from listing
  - { name: Bifold,      code: BIF,    leaves: 2, basePrice: 795 }  # 2 narrow slabs + hinging; between single and pair
  - { name: Barn Door,   code: BARN,   leaves: 1, basePrice: 595 }  # oversized slab to overlap the opening; hardware not included
  - { name: Pocket Door, code: POCKET, leaves: 1, basePrice: 545 }  # single slab, extra fitting for the pocket frame; frame not included

# Adders are per slab.
grades:
  - { name: Clear Pine,  code: CLR, adder: 0 }
  - { name: Knotty Pine, code: KNT, adder: 0 }    # same price as clear, so "singles from $495" holds

styles:
  - { name: 2-Panel Square Top, code: 2PSQ, adder: 0 }    # the base door
  - { name: Shaker,             code: SHK,  adder: 0 }    # same build as square top, flat panels
  - { name: 4-Panel,            code: 4P,   adder: 50 }   # extra rails and panels
  - { name: 2-Panel Arch Top,   code: 2PAR, adder: 125 }  # curved top rail and panel
  - { name: Mirrored,           code: MIR,  adder: 125 }  # mirror panel
  - { name: French Glass,       code: GLS,  adder: 150 }  # tempered glass and muntins
  - { name: Louvered,           code: LOUV, adder: 175 }  # most labor: dozens of slats

# Combinations you don't build. Any field left out matches everything.
exclude: []
  # - { configuration: POCKET, style: LOUV }

madeToOrder:
  customSize: true
  # leadTimeWeeks: 3   # TODO
