description: |-
  The traditional raised panel design has been a staple of home design for hundreds of years. The frame and panel construction was initially developed to combat moisture damage, but the style quickly became a favorite for those looking to add a grand statement to their home.

  Available in widths from 12" to 36", this 6 panel raised double hip pine interior door is offered in 80", 84", and 96" height options to fit a wide range of interior door openings.

  This beautiful bedroom door or kitchen door features a 6-panel double hip design on 1 3/8" thick pine. The double hip on the panel adds just a touch more detail to the overall design. This 6 panel door comes in a variety of heights and widths to suit any space in your home. The clear pine material is perfect for either a rich stain or paint finish.

  * Widths 22" and under include only three panels but follow the six panel design and layout
