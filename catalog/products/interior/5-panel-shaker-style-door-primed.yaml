description: |-
  Shaker doors are recognized for exceptional craftsmanship, meticulous detail, and timeless simplicity. The minimalism characteristic of this style is evident in our line of Shaker doors. Our selection of Shaker style interior doors (prehung) are ideal for anyone looking to add traditional or craftsman details to their home.

  The 5-panel Shaker style interior door (primed) features a robust design on 1 3/8" thick pine. The panels are stacked in a traditional Shaker style. The door comes in a variety of heights and widths to suit any space in your home. The primed door is ready for paint finish!

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of the Shaker style is made with solid MDF.
