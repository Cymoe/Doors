description: |-
  Description:

  Create a clean, timeless look throughout your home with our single panel Shaker style pine wood interior door. Designed with one recessed Shaker-style panel, this door offers a simple profile that works beautifully in bedrooms, bathrooms, closets, offices, hallways, pantries, laundry rooms, and other interior spaces.

  This single panel door is crafted from pine wood with engineered solid core construction, giving it the natural character of wood with added stability for everyday residential use. The single recessed panel creates a refined, uncluttered look that fits well with Craftsman, farmhouse, traditional, transitional, and modern interiors.

  As a single panel Shaker door, this design is ideal for homeowners who want a versatile interior door that can blend into a whole-home update or stand out as a clean architectural detail in a single room. The clear pine finish can be painted or stained, allowing you to customize the look to match your trim, flooring, cabinetry, or existing interior doors.

  This single Shaker door delivers a balanced combination of simplicity, warmth, and long-lasting interior design appeal.

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of the Shaker style is made with solid MDF.

  Product Specifications

  Door Type: Interior slab door

  Door Style: Shaker style door

  Panel Design: Single recessed Shaker-style panel

  Panel Count: 1 panel

  Material: Pine wood

  Construction: Engineered solid core pine wood

  Core Type: Engineered solid core

  Finish: Clear Pine

  Finish Compatibility: Paintable or stainable

  Door Thickness: 1-3/8"

  Available Heights: 80", 84", and 96"

  Available Widths: 12", 16", 18", 24", 26", 28", 30", 32", 34", and 36"

  • Installation Type: Slab door installation

  Jamb Kit Compatibility: Compatible with select Door to Door RapidHang™ jamb kit options where available

  Hardware Prep: Available with select jamb kit options

  Recommended Use: Bedrooms, bathrooms, closets, offices, hallways, pantries, laundry rooms, and other interior spaces

  Design Style: Shaker, Craftsman, farmhouse, traditional, transitional, and modern classic interiors

  Shipping Area: 48 contiguous U.S. states and Washington, D.C.

  Key Features

  • Classic single panel door with a clean recessed Shaker-style design

  • Ideal single panel Shaker door for bedrooms, bathrooms, closets, offices, hallways, pantries, and laundry rooms

  • Crafted from pine wood with engineered solid core construction

  • Clear pine finish can be painted or stained

  • Simple profile complements modern, farmhouse, Craftsman, traditional, and transitional interiors

  • Available in multiple standard widths and heights

  • Designed for interior residential use

  • Can be used as a slab door or paired with compatible Door to Door RapidHang™ jamb kit options where available

  • Great choice for single-room replacements or full-home interior door upgrades
