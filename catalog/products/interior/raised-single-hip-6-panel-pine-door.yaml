description: |-
  The traditional raised panel design has been a staple of home design for hundreds of years. The frame and panel construction was initially developed to combat moisture damage, but the style quickly became a favorite for those looking to add a grand statement to their home.

  Sizing options include 18", 24", 28", 30", 32", 34", and 36" widths, available in 80" and 96" height options. This 6 panel raised single hip clear pine wood interior door gives you a wide range of standard width options for interior openings, along with both standard and taller door heights.

  This wood interior 6 panel door features a single hip design on 1 3/8" thick pine. The door comes in a variety of heights and widths to suit most any space in your home. The clear pine material is perfect for either a rich stain or paint finish.

  * Widths 22" and under include only three panels but follow the six panel design and layout
