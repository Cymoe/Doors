description: |-
  Louver doors are a great solution for small spaces. The louvers, or slats, on the doors allow for easy air ventilation, making them a popular choice for laundry rooms, utility closets, and more. For more traditional uses, louver doors are beautiful additions to any relaxed, contemporary home.

  This door features a 2-panel design on 1 3/8" thick pine. Both the bottom includes a traditional raised panel while the top features the louvered panel. The door comes in a variety of heights and widths to suit most any space in your home. The clear pine material is perfect for a stain finish.

  Stiles and rails are made of solid wood and can be trimmed down; however, the tolerance is minimal as too much trimming may affect the integrity of the door. Please contact customer service to confirm cuts or receive a quote for special dimensions. Standard louvers are 1-1/4" wide.
