title: 2 Panel Shaker Style Pine Wood Interior Door
status: active
category: interior
description: |-
  Our 2 panel Shaker style pine wood interior door is popular because of its impeccable craftsmanship and simplicity of design. The minimalism characteristic of this style is evident in our line of Shaker doors. These Shaker doors are ideal for anyone looking to add traditional or craftsman style to their home.

  This door features a 2-panel design on 1 3/8" thick pine. The panels are stacked in a traditional Shaker style. This double panel Shaker door comes in a variety of heights and widths to suit any space in your home. The clear pine material is perfect for either a stain or paint finish.

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of the Shaker style is made with solid MDF.
