description: |-
  Shaker style is known for its impeccable craftsmanship, careful attention to detail and simplicity of design. The minimalism characteristic of this style is evident in our line of Shaker doors. These Shaker doors are ideal for anyone looking to add traditional or craftsman style to their home.

  This beautiful interior glass door features a 3-panel design on 1 3/8" thick pine. The panels are stacked in a traditional Shaker style. The door comes in a variety of heights and widths to suit most any space in your home.

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of this Shaker style door is made with single pane, non-insulated, tempered glass. The frosted glass is made using hydrochloric acid to prevent chipping and preserve a velvety texture on the material.
