description: |-
  With its characteristic rich grain and knots, the knotty pine species is a beautiful addition to any rustic or country-style home. Our Knotty Pine doors come in several panel options that highlight the uniqueness of the wood.

  Sizing options include 18", 20", 24", 28", 30", 32", 34", and 36" widths, all available in an 80" height. This 2 panel square top v-groove knotty pine interior door gives you a wide range of standard width options for interior openings while keeping a consistent 80" door height.

  This door features a 2-panel design on 1 3/8" thick knotty pine. The bottom and top panels are both squared in a simple and traditional style. The door comes in a variety of heights and widths to suit most any space in your home. Finish with a clear top coat to showcase the wood's natural beauty.
