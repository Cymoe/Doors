description: |-
  Description

  Bring clean lines and timeless style to your home with our 3 panel Shaker style interior wood primed door. Designed with three stacked Shaker-style panels, this door offers a balanced look that works beautifully in bedrooms, bathrooms, closets, offices, hallways, pantries, and other interior spaces.

  This 3 panel interior door is crafted with engineered solid core pine stiles and rails, along with solid MDF Shaker-style panel inlays for added stability and a smooth, paint-ready surface. The primed finish makes it easy to customize with your preferred paint color, whether you want a classic white door, a bold accent, or a finish that matches your existing trim.

  With its simple profile and versatile design, this 3 panel Shaker door complements a wide range of home styles, including Craftsman, farmhouse, transitional, traditional, and modern classic interiors. Whether you are replacing one door or updating several rooms, this 3 panel Shaker interior door delivers a polished, high-quality look without overwhelming the space.

  Available in multiple standard widths and both 80" and 96" heights, this 3 panel door can be installed as a slab or paired with Door to Door’s RapidHang™ jamb kit options for a more complete installation solution.

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of the Shaker style is made with solid MDF.

  Widths 18" and under include only two panels but follow the three panel design and layout

