  Recommended Use: Bedrooms, bathrooms, closets, offices, hallways, pantries, laundry rooms, and other interior spaces

  Design Style: Shaker, Craftsman, farmhouse, transitional, traditional, and modern classic

  Double Door Application: Can be used in paired double-door configurations

  Special Note: Widths 18" and under include two panels while maintaining the overall 3-panel design style.

  Key Features

  • Classic 3 panel Shaker style interior wood door, primed for a clean and timeless look
  Ideal as a 3 panel interior door for bedrooms, bathrooms, closets, offices, hallways, pantries, and laundry rooms

  • Three stacked Shaker-style panels for a balanced interior design

