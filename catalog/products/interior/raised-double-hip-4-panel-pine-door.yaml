description: |-
  Description

  Bring timeless craftsmanship and natural warmth to your home with our 4 panel raised double hip pine wood door. Designed with a classic raised panel profile, this 4 panel door adds depth, character, and traditional style to bedrooms, bathrooms, closets, offices, hallways, and other interior spaces.

  The traditional raised panel design has been a staple of home design for hundreds of years. The frame and panel construction was initially developed to combat moisture damage, but the style quickly became a favorite for those looking to add a grand statement to their home.

  Crafted from pine with an engineered solid core construction, this 4 panel interior door is beautiful and durable for everyday residential use. These unfinished doors can be painted or stained as needed to match your home project, giving you the flexibility to coordinate with existing trim, flooring, cabinetry, or your overall interior design.

  The raised double hip panel design creates a more decorative appearance than flat panel doors, making it a strong choice for homeowners who want a classic, high-quality upgrade. Whether you are replacing a single slab or updating multiple rooms throughout your home, this 4 panel wood door provides a versatile look that works well in traditional, colonial, farmhouse, and transitional interiors.

  This raised double hip 4 panel wood door features a beautiful design on 1 3/8" thick pine. This custom interior door comes in a variety of heights and widths to suit any space in your home.

  This pine interior slab door can also be paired with Door to Door’s RapidHang™ jamb kit system for a more complete installation solution. Its solid core construction, paintable and stainable finish, and timeless 4-panel layout make it a dependable option for interior renovation projects of all sizes.

  * Widths 20" and under include only two panels but follow the four panel design and layout

  Product Specifications:

  Door Type: Interior slab door

  Door Style: Raised panel door

  Panel Design: 4 panel raised double hip

  Material: Pine wood

  Construction: Veneered engineered solid core pine wood

  Core Type: Engineered solid core

  Finish: Unfinished

  Finish Options: Paintable or stainable

  Door Thickness: 1-3/8"

  Available Heights: 80" and 96"

  Available Widths: 12", 16", 18", 20", 24", 28", 30", 32", and 36"

  Installation Type: Slab door installation

  Jamb Kit Compatibility: Compatible with Door to Door RapidHang™ jamb kit options

  Recommended Use: Bedrooms, bathrooms, closets, offices, hallways, and other interior spaces

  Design Style: Traditional, colonial, farmhouse, and transitional interiors

  Hardware Prep: Available with select jamb kit options

  Special Note: Widths 20" and under include two panels while maintaining the overall 4-panel design style.

  Key Features:

  • Classic 4 panel door design with raised double hip detailing

  • Ideal as a 4 panel interior door for bedrooms, bathrooms, closets, offices, and hallways

  • Pine wood surface that can be painted or stained

  • Engineered solid core construction for added stability

  • Traditional raised panel profile for a decorative interior look

  • Available in multiple widths and heights

  • Compatible with Door to Door RapidHang™ jamb kit options

  • Great fit for traditional, farmhouse, colonial, and transitional home styles
