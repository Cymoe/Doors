description: |-
  Nothing is more traditional than a paneled door. If you're looking to add a little design interest to your door style, why not try an arched design. Arched panels add intrigue to any door while maintaining the traditional look and feel.

  Available in widths from 18" to 36", this 2 panel arch top pine interior door is offered in 80" and 96" height options to fit a variety of interior door openings.

  This interior wood door features a 2-panel design on 1 3/8" thick pine. The bottom panel is square while the top features a gentle arch for added interest. The door comes in a variety of heights and widths to suit most any space in your home. The clear pine material is perfect for either a rich stain or paint finish.
