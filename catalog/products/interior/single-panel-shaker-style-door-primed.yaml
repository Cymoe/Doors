description: |-
  Description

  Create a clean, modern look throughout your home with our single panel Shaker style interior wood primed door. Designed with one recessed Shaker-style panel, this door delivers a simple yet timeless appearance that works beautifully in bedrooms, bathrooms, closets, offices, hallways, pantries, laundry rooms, and other interior spaces.

  This single panel Shaker door is crafted with engineered solid core pine stiles and rails, along with a solid MDF Shaker-style inlay for a smooth, stable, and paint-ready surface. The primed finish makes it easy to customize the door with your preferred paint color, whether you want a classic white finish, a bold accent color, or a look that matches your trim and existing interior doors.

  With its minimalist design, this single panel interior door is a versatile choice for homeowners looking to update one room or create a consistent look throughout the entire home. The simple profile of this single Shaker door pairs well with farmhouse, Craftsman, transitional, traditional, and modern interiors.

  This 1 panel Shaker door offers a clean and refined look that complements a wide range of home styles while providing dependable everyday performance.

  Door stiles (sides) and rails (horizontal portion) are made of engineered solid core pine. The inlaid portion of the Shaker style is made with solid MDF.

  Product Specifications

  Door Type: Interior slab door

  Door Style: Shaker style door

  Panel Design: Single recessed Shaker-style panel

  Panel Count: 1 panel

  Material: Pine and MDF

  Construction: Engineered solid core pine with solid MDF panel inlay

  Core Type: Engineered solid core

  Stile & Rail Material: Engineered solid core pine

  Panel/Inlay Material: Solid MDF

  Finish: Primed

  Finish Compatibility: Paintable

  Recommended Paint: Water-based latex paint

  Door Thickness: 1-3/8"

  Available Heights: 80" and 96"

  Available Widths: 16", 18", 24", 28", 30", 32", and 36"

  Installation Type: Slab door installation

  Jamb Kit Compatibility: Compatible with Door to Door RapidHang™ jamb kit options

  Hardware Prep: Available with select jamb kit options

  Recommended Use: Bedrooms, bathrooms, closets, offices, hallways, pantries, laundry rooms, and other interior spaces

  Design Style: Shaker, Craftsman, farmhouse, traditional, transitional, and modern classic

  Double Door Application: Can be used in paired double-door configurations

  Special Note: Doors 16" and under in width may not be eligible for bore prep because the stile may be too narrow.

  Key Features

  • Classic single panel Shaker door with a clean, timeless design

  • Ideal as a single panel interior door for bedrooms, bathrooms, closets, offices, hallways, pantries, and laundry rooms

  • Simple profile works well with modern, farmhouse, Craftsman, traditional, and transitional interiors

  • Minimal one panel door design creates a clean and uncluttered look

  • Primed surface is ready for sanding and preparation

  • Engineered solid core pine stiles and rails for added stability

  • Solid MDF Shaker-style panel inlay for a smooth finish

  • Available in multiple standard widths and heights

  • Compatible with Door to Door RapidHang™ jamb kit options

  • Great for single-room replacements or full-home interior door upgrades
