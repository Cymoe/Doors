description: |-
  Description

  Add charm, character, and a polished finishing touch to your kitchen with our single lite decorative glass primed wood pantry door. Designed with decorative glass that clearly identifies the pantry space, this glass pantry door is a practical and stylish upgrade for kitchens and pantries.

  This wood pantry door with glass combines classic wood construction with a single lite decorative glass panel, giving your space a more custom look while still maintaining separation between rooms. The wood pantry door features a primed finish that offers a foundation for preparation. The finish makes it easy to coordinate with your cabinets, trim, walls, or existing interior doors for a cohesive look.

  Whether you are renovating your kitchen or replacing an outdated interior door, this pantry door for kitchen spaces offers a timeless design that works well with farmhouse, cottage, traditional, and transitional interiors. Its decorative glass detail adds personality without overwhelming the room, making it a great choice for homeowners who want their pantry entrance to feel both functional and thoughtfully designed.

  Available in multiple standard widths and an 80" height, this single lite decorative glass primed wood pantry door is designed as an interior slab door and can be paired with compatible jamb kit options where available.

