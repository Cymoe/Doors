description: |-
  This species has excellent strength properties and is well known for its workability. The wood dries rapidly with small dimensional movement and little tendency to check. It is relatively easy to work, with good machining qualities. Our Exterior doors are made with solid engineered hardwood, formed in a cross-grain pattern for added durability, then finished with a thin veneered layer of either Fir, Pine, or Mahogany.

