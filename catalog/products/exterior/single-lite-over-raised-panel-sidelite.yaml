description: |-
  Please allow 2-3 weeks lead time.

  The single lite over raised panel front door sidelite is a beautiful and stylish option for a replacement or an addition to a new home. The lites, or glass panes, allow natural light to flow into the room and make for a timeless and elegant look. Our exterior sidelites come in a variety of grid options, from single lite to a raised panel and lite combination. The clear pine material can be finished using a rich stain or a clear top coat for a natural look.

  Glass is double-paned, tempered glass. You can choose to have Clear glass or Low E. Low E is energy efficient, has built-in tint, and falls under the Energy Star Rating. The grids in our 3 and 5-Lite Sidelites are made of flat, painted aluminum material.

  *Stiles (sides) are 1-7/8" wide.
