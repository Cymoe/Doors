description: |-
  Description

  Minot - Gray-Washed Oak Luxury Vinyl SPC Flooring brings a calm, light-to-mid gray oak look to kitchens, entryways, hallways, living rooms, bedrooms, laundry rooms, and other busy areas of the home. Its soft cool-gray base, subtle beige and ash undertones, pale silver-gray tones, and warm linen highlights create a relaxed, driftwood-inspired appearance that works well in bright, modern interiors.

  This luxury vinyl flooring is built with SPC construction, which stands for stone plastic composite or stone polymer composite. SPC flooring is a rigid core vinyl plank flooring material designed to create a firm, stable feel underfoot. Instead of using a soft, flexible vinyl-only structure, SPC flooring uses a dense core that helps support everyday performance in active rooms with foot traffic, furniture movement, kids, pets, and routine cleaning.

  Minot is a strong gray oak vinyl plank flooring option for homeowners who want the look of weathered wood with the practical benefits of rigid core vinyl. Its layered construction includes a realistic wood-look design surface that captures linear oak grain, fine knots, and soft cathedral patterns, along with an SPC core that adds structure and stability. This makes it a practical choice for high-traffic and moisture-prone areas where natural hardwood may require more upkeep.

  As a gray oak vinyl flooring option, Minot fits beautifully in Scandinavian, coastal modern, minimalist, and light contemporary interiors. Pair it with bright whites, soft creams, pale blues, sage greens, matte metals, natural wood accents, clean-lined furniture, and textured linens for a soft, airy flooring foundation. Whether you are updating one room or creating a cohesive look across connected spaces, Minot offers a clean wood-look style with the low-maintenance performance homeowners want from luxury vinyl SPC flooring.

