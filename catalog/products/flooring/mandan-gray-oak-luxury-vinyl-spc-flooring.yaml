description: |-
  Description

  Mandan Mid-Tone Gray Oak Luxury Vinyl SPC Flooring brings a cool, modern wood-look finish to kitchens, entryways, hallways, living rooms, bedrooms, laundry rooms, and other busy areas of the home. Its ash-gray coloring, subtle blue-gray undertones, faint warm driftwood hints, and pale charcoal highlights create a balanced gray oak appearance that feels clean, contemporary, and easy to style.

  This gray vinyl flooring is designed for homeowners who want the look of weathered oak with the practical performance of rigid core luxury vinyl. SPC stands for stone plastic composite or stone polymer composite, a dense core construction commonly used in luxury vinyl plank flooring to help create a firm, stable feel underfoot. Unlike softer, flexible vinyl flooring, SPC flooring is built as a rigid plank product, making it a smart choice for active rooms with daily foot traffic.

  Mandan is a strong mid-tone gray oak vinyl flooring option for spaces where both style and everyday durability matter. The wood-look design layer captures the movement of natural oak grain, including linear grain details, knots, rays, and soft cathedral patterns. The rigid SPC core adds structure and stability, while the surface layer helps support easier maintenance in spaces where spills, shoes, kids, pets, and routine cleaning are part of everyday life.

  With its cool gray oak look, Mandan works especially well in contemporary, urban minimalist, Scandinavian-modern, and cool transitional interiors. It is also a great option for shoppers who like the brightness of light gray vinyl plank flooring but want a slightly deeper, more grounded gray tone. Pair it with bright whites, cool grays, muted blues, charcoal accents, soft greens, matte black hardware, brushed nickel finishes, linen textures, and streamlined furniture for a polished, modern flooring foundation.

  Whether you are updating a single room or creating a consistent look across connected spaces, Mandan Mid-Tone Gray Oak Luxury Vinyl SPC Flooring offers a clean, durable, low-maintenance flooring option for real-life homes.

