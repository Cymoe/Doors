description: |-
  Description

  Larimore - Brown Oak Luxury Vinyl SPC Flooring brings a rich, espresso-dark oak look to kitchens, entryways, hallways, living rooms, and other high-traffic areas of the home. Its deep charcoal-brown color, warm undertones, and subtle tobacco and espresso highlights create the look of gently smoked European oak with a bold, grounded finish.

  This luxury vinyl flooring is built with SPC construction, which stands for stone plastic composite or stone polymer composite. SPC flooring is a type of rigid core vinyl plank flooring commonly made with a dense stone-based core that helps the plank feel stable underfoot. Unlike softer, flexible vinyl flooring, SPC flooring is designed to provide a firmer structure that works well in active rooms with daily foot traffic.

  Larimore is a strong choice for homeowners who want the look of dark brown oak flooring with the practical performance of rigid core luxury vinyl. Its layered construction helps support everyday durability, with a wood-look design surface for visual appeal and an SPC core for added stability. This makes it a practical brown oak vinyl flooring option for busy spaces where kids, pets, furniture movement, spills, and frequent cleaning are part of daily life.

  Since SPC flooring is commonly used in moisture-prone and high-traffic rooms, Larimore can be a smart alternative to natural hardwood. It gives homeowners the warmth and depth of brown oak flooring without the same maintenance concerns often associated with real wood in active areas of the home.

  Larimore works especially well in modern rustic, industrial luxe, transitional, and moody contemporary interiors. Use it to add contrast against crisp white walls, balance soft gray paint colors, or create a more dramatic look with brass hardware, black accents, leather furniture, jewel tones, and earthy neutrals. Larimore - Brown Oak Luxury Vinyl SPC Flooring gives your home a darker wood-look floor that feels stylish, durable, and ready for everyday use.

